name: Update stat cards

on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 Colombo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_stats.py]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh stat cards"
          git push
